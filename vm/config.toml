# ============================================================================
# Gazebo Manager 配置文件
# ============================================================================
#
# 注意: SSH 端口 (2222 -> 22) 是内部固定的，不可配置
#
# [network.tcp_mappings] 端口映射格式:
#   host_port  = 宿主机端口 (Windows)
#   guest_port = 虚拟机端口 (QEMU/Linux)
#   description = 描述 (可选)
#
# ============================================================================

[[network.tcp_mappings]]
host_port = 11345
guest_port = 11345
description = "Gazebo Server"

